[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-production"
version = "0.1.0"
description = "Production-style ETL pipeline: API/DB extract -> SQLite staging -> dimensional model"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "pandas",
    "pyyaml",
    "requests",
    "tenacity",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
